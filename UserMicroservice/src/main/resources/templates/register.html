<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            background: white; padding: 40px; border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 420px;
        }
        h2 { text-align: center; color: #333; margin-bottom: 25px; }
        .form-row { display: flex; gap: 10px; }
        .form-group { margin-bottom: 16px; flex: 1; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; font-size: 13px; }
        input {
            width: 100%; padding: 11px; border: 1px solid #ddd;
            border-radius: 5px; font-size: 14px;
        }
        input:focus { outline: none; border-color: #11998e; }
        button {
            width: 100%; padding: 12px; background: #11998e; color: white;
            border: none; border-radius: 5px; font-size: 16px; cursor: pointer;
        }
        button:hover { background: #0d7a70; }
        .msg { font-size: 14px; margin-top: 10px; text-align: center; }
        .error { color: #e74c3c; }
        .success { color: #27ae60; }
        .login-link { text-align: center; margin-top: 15px; font-size: 14px; }
        .login-link a { color: #11998e; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Create Account</h2>
        <form id="registerForm">
            <div class="form-row">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="firstName" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="lastName" required>
                </div>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Phone (optional)</label>
                <input type="text" id="phone">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required minlength="6">
            </div>
            <button type="submit">Register</button>
            <div id="message" class="msg"></div>
        </form>
        <div class="login-link">Already have an account? <a href="http://localhost:8082/login">Login</a></div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageDiv = document.getElementById('message');
            const body = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                password: document.getElementById('password').value
            };
            try {
                const response = await fetch('http://localhost:8082/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await response.json();
                if (response.ok) {
                    messageDiv.className = 'msg success';
                    messageDiv.textContent = 'Registration successful! Redirecting to login...';
                    setTimeout(() => window.location.href = 'http://localhost:8082/login', 1500);
                } else {
                    messageDiv.className = 'msg error';
                    messageDiv.textContent = data.message || 'Registration failed';
                }
            } catch (err) {
                messageDiv.className = 'msg error';
                messageDiv.textContent = 'An error occurred. Please try again.';
            }
        });
    </script>
</body>
</html>

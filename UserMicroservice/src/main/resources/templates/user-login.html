<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            background: white; padding: 40px; border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 400px;
        }
        h2 { text-align: center; color: #333; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; font-size: 13px; }
        input {
            width: 100%; padding: 12px; border: 1px solid #ddd;
            border-radius: 5px; font-size: 14px;
        }
        input:focus { outline: none; border-color: #11998e; }
        button {
            width: 100%; padding: 12px; background: #11998e; color: white;
            border: none; border-radius: 5px; font-size: 16px; cursor: pointer;
        }
        button:hover { background: #0d7a70; }
        .msg { font-size: 14px; margin-top: 10px; text-align: center; }
        .error { color: #e74c3c; }
        .success { color: #27ae60; }
        .register-link { text-align: center; margin-top: 15px; font-size: 14px; }
        .register-link a { color: #11998e; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>User Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Login</button>
            <div id="message" class="msg"></div>
        </form>
        <div class="register-link">Don't have an account? <a href="http://localhost:8082/register">Register</a></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageDiv = document.getElementById('message');
            try {
                const response = await fetch('http://localhost:8082/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await response.json();
                if (response.ok) {
                    messageDiv.className = 'msg success';
                    messageDiv.textContent = 'Login successful! Redirecting...';
                    localStorage.setItem('userToken', data.token);
                    localStorage.setItem('userEmail', data.email);
                    localStorage.setItem('userFirstName', data.firstName);
                    localStorage.setItem('userLastName', data.lastName);
                    setTimeout(() => window.location.href = 'http://localhost:8082/dashboard', 1000);
                } else {
                    messageDiv.className = 'msg error';
                    messageDiv.textContent = data.message || 'Login failed';
                }
            } catch (err) {
                messageDiv.className = 'msg error';
                messageDiv.textContent = 'An error occurred. Please try again.';
            }
        });
    </script>
</body>
</html>

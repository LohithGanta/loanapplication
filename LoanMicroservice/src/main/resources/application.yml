spring:
  application:
    name: LOAN-MICROSERVICE

  datasource:
    url: jdbc:mysql://localhost:3306/loan_application_db
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:0205}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8084

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
